name: Deploy to Coolify

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Coolify
        # O webhook fica guardado como secret no GitHub Actions para não ser exposto no repositório.
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"
