services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: cv-portfolio-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - cv-network
        depends_on:
            - db

    web:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - cv-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: cv_portfolio
            MYSQL_ROOT_PASSWORD: password
            MYSQL_PASSWORD: password
            MYSQL_USER: user
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - cv-network
        ports:
            - "33060:3306"

networks:
    cv-network:
        driver: bridge

volumes:
    db-data:
